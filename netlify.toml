# ══════════════════════════════════════════════════════════════════
# Netlify deploy config for the N1CE Circle presentation site
# ══════════════════════════════════════════════════════════════════
# Serve all static files from public folder + copy emails folder

[build]
  publish = "public"
  command = "mkdir -p public/emails && cp -r emails/* public/emails/"

# Nicer URLs: serve beautiful HTML files without extensions
[[redirects]]
  from = "/"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/presentation"
  to = "/presentation.html"
  status = 200

[[redirects]]
  from = "/pitch"
  to = "/presentation.html"
  status = 200

[[redirects]]
  from = "/operator"
  to = "/operator.html"
  status = 200

[[redirects]]
  from = "/margin"
  to = "/operator.html"
  status = 200

# Fallback for SPA-style routing
[[redirects]]
  from = "/*"
  to = "/join.html"
  status = 404

[[redirects]]
  from = "/internal"
  to = "/operator.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/emails/variants-gallery.html"
  status = 200

[[redirects]]
  from = "/preview/variants"
  to = "/emails/variants-gallery.html"
  status = 200

[[redirects]]
  from = "/preview/welcome-email"
  to = "/emails/welcome-email.html"
  status = 200

[[redirects]]
  from = "/preview/welcome-:flavor"
  to = "/emails/variants/welcome-:flavor.html"
  status = 200

[[redirects]]
  from = "/preview/gmail-welcome"
  to = "/emails/mocks/gmail-welcome-berry.html"
  status = 200

[[redirects]]
  from = "/preview/gmail-welcome-:flavor"
  to = "/emails/mocks/gmail-welcome-:flavor.html"
  status = 200

# Cache video + large PNGs aggressively so the preview loads fast
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Block indexing of any source files that might accidentally end up in
# the deploy (scripts, docs, server.js, node_modules stuff). Robots.txt
# handles crawlers; files themselves stay unlisted.
[[headers]]
  for = "/*.md"
  [headers.values]
    X-Robots-Tag = "noindex"
