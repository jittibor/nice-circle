<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the N1CE Circle</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background:
        radial-gradient(ellipse at 25% 20%, rgba(255, 122, 199, 0.18) 0%, transparent 45%),
        radial-gradient(ellipse at 75% 80%, rgba(208, 64, 168, 0.22) 0%, transparent 50%),
        linear-gradient(160deg, #8C1470 0%, #5A0A48 40%, #2E0428 100%);
      font-family: 'Oswald', Arial, sans-serif;
      color: #FAF7F2;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .shell {
      width: 100%;
      max-width: 460px;
      text-align: center;
      position: relative;
    }
    .logo {
      display: block;
      width: 110px;
      margin: 0 auto 48px;
      opacity: 0.98;
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #FFDD00;
      font-weight: 700;
      margin: 0 0 14px;
    }
    .title {
      font-family: 'Anton', 'Arial Black', sans-serif;
      font-size: 72px;
      line-height: 0.92;
      letter-spacing: -0.02em;
      margin: 0 0 18px;
      color: #FFFFFF;
      text-transform: uppercase;
    }
    .title em {
      font-style: normal;
      color: #F085C6;
    }
    .title .dot { color: #FF5600; }
    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255,255,255,0.82);
      margin: 0 auto 36px;
      max-width: 360px;
    }
    form { display: flex; flex-direction: column; gap: 14px; }
    .field {
      position: relative;
      text-align: left;
    }
    .field label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #FFDD00;
      font-weight: 700;
      display: block;
      margin: 0 0 8px;
    }
    .field input, .field select {
      width: 100%;
      padding: 16px 18px;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      color: #FFFFFF;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      outline: none;
      transition: all 0.15s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.35); }
    .field input:focus, .field select:focus {
      border-color: #FF5600;
      box-shadow: 0 0 0 3px rgba(255,86,0,0.2);
      background: rgba(0,0,0,0.5);
    }
    .field select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path fill='%23FF5600' d='M4 6l4 4 4-4z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 44px;
    }
    .field select option {
      background: #1A0014;
      color: #FFFFFF;
    }
    .cta {
      margin-top: 14px;
      padding: 18px 24px;
      font-family: 'Anton', 'Arial Black', sans-serif;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #FFFFFF;
      background: #FF5600;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 8px 32px rgba(255,86,0,0.28);
    }
    .cta:hover {
      background: #FF7020;
      transform: translateY(-1px);
      box-shadow: 0 12px 40px rgba(255,86,0,0.38);
    }
    .cta:active { transform: translateY(0); }
    .cta .arrow { display: inline-block; margin-left: 4px; transition: transform 0.15s; }
    .cta:hover .arrow { transform: translateX(4px); }
    .fine-print {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(255,255,255,0.45);
      margin: 18px 0 0;
    }
    .fine-print a { color: rgba(255,255,255,0.7); text-decoration: underline; }

    /* The spinner/hold state after submit */
    .loading-screen {
      position: fixed; inset: 0;
      background: #0A0A0A;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .loading-screen.show {
      display: flex;
      opacity: 1;
    }
    .loader {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,86,0,0.2);
      border-top-color: #FF5600;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      margin-top: 24px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .loading-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <img class="logo" src="/images/n1ce-logo-white.png" alt="N1CE" />

    <p class="kicker">N1CE Circle · Closed Beta</p>
    <h1 class="title">Join <em>The<br/>Circle<span class="dot">.</span></em></h1>
    <p class="subtitle">Premium Swedish nicotine pouches. Members only. Real rewards.</p>

    <form id="join-form" onsubmit="joinCircle(event)">
      <div class="field">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" name="firstName" placeholder="Your name" required autofocus />
      </div>

      <div class="field">
        <label for="flavor">Favourite flavour</label>
        <select id="flavor" name="flavor">
          <option value="berry">Purple Punch (Berry-Licious)</option>
          <option value="peach">Peach Flame</option>
          <option value="wintergreen">Wintergreen Malla</option>
          <option value="melon">Melon Blaze</option>
          <option value="mango">Mango Rush</option>
          <option value="mint">Jalapeño Glow</option>
          <option value="cafe">Smooth Cappuccino</option>
          <option value="blue">Mint Freeze</option>
        </select>
      </div>

      <button type="submit" class="cta">Join The Circle <span class="arrow">→</span></button>

      <p class="fine-print">
        By joining, you confirm you are 21+. See our <a href="#">Terms</a> &amp; <a href="#">Privacy</a>.
      </p>
    </form>
  </div>

  <!-- Submission → "sending" → redirect -->
  <div class="loading-screen" id="loading">
    <div class="loader"></div>
    <p class="loading-text">You're in.</p>
    <p class="loading-sub">Delivering your welcome email to Gmail…</p>
  </div>

  <script>
    function joinCircle(event) {
      event.preventDefault();
      var name = document.getElementById('firstName').value.trim();
      var flavor = document.getElementById('flavor').value;
      if (!name) return;

      // Capitalize first letter of name for display
      name = name.charAt(0).toUpperCase() + name.slice(1);

      // Show sending state
      document.getElementById('loading').classList.add('show');

      // Redirect after 1.4s to the Gmail mock preview with the selected name
      setTimeout(function() {
        window.location.href = '/emails/mocks/gmail-welcome-' + flavor + '.html?name=' + encodeURIComponent(name);
      }, 1400);
    }
  </script>
</body>
</html>
