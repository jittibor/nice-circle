<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail · You won. UFC Freedom 250.</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #f6f8fc; font-family: 'Google Sans', 'Roboto', Arial, sans-serif; color: #202124; }

    .gnav { display: flex; align-items: center; height: 64px; padding: 0 16px; background: #f6f8fc; border-bottom: 1px solid #e8eaed; }
    .gnav-burger { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; color: #5f6368; font-size: 20px; }
    .gnav-logo { display: flex; align-items: center; gap: 10px; margin-right: 24px; }
    .gnav-logo svg { width: 40px; height: 29px; }
    .gnav-logo-text { font-size: 22px; color: #5f6368; letter-spacing: -0.2px; }
    .gnav-search { flex: 1; max-width: 720px; display: flex; align-items: center; background: #eaf1fb; border-radius: 8px; height: 48px; padding: 0 16px; gap: 12px; color: #5f6368; }
    .gnav-search input { flex: 1; border: 0; background: transparent; font-size: 16px; color: #202124; outline: none; font-family: inherit; }
    .gnav-right { display: flex; align-items: center; gap: 4px; margin-left: auto; padding-left: 16px; }
    .gnav-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #5f6368; font-size: 18px; cursor: pointer; }
    .gnav-icon:hover { background: #e8eaed; }
    .gnav-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #E2003F, #FF5600); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; margin-left: 8px; }

    .shell { display: flex; height: calc(100vh - 64px); }

    .sidebar { width: 256px; padding: 8px; flex-shrink: 0; }
    .compose { display: flex; align-items: center; gap: 12px; background: #c2e7ff; color: #001d35; padding: 14px 24px; border-radius: 16px; font-weight: 500; font-size: 14px; cursor: pointer; margin-bottom: 16px; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .compose .plus { font-size: 20px; font-weight: 300; }
    .folders { list-style: none; margin: 0; padding: 0; }
    .folder { display: flex; align-items: center; gap: 16px; padding: 8px 24px; border-radius: 0 16px 16px 0; font-size: 14px; color: #202124; cursor: pointer; }
    .folder.active { background: #d3e3fd; font-weight: 700; }
    .folder:hover:not(.active) { background: #e8eaed; }
    .folder .icon { width: 20px; text-align: center; color: #5f6368; }
    .folder.active .icon { color: #001d35; }
    .folder .count { margin-left: auto; font-size: 12px; color: #5f6368; }

    .mailview { flex: 1; background: #fff; border-radius: 16px 0 0 0; margin: 0 8px 8px 0; overflow-y: auto; display: flex; flex-direction: column; }

    .mtoolbar { display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid #e8eaed; gap: 4px; background: #fff; position: sticky; top: 0; z-index: 10; }
    .mtbtn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #5f6368; cursor: pointer; font-size: 16px; }
    .mtbtn:hover { background: #f1f3f4; }
    .mtbtn-back { margin-right: 8px; }
    .mtbtn-divider { width: 1px; height: 24px; background: #e8eaed; margin: 0 8px; }
    .mtbtn-page { margin-left: auto; font-size: 13px; color: #5f6368; display: flex; align-items: center; gap: 8px; }

    .subject-row { padding: 24px 72px 0; display: flex; align-items: flex-start; gap: 16px; }
    .subject-text { font-size: 22px; font-weight: 400; color: #202124; flex: 1; line-height: 1.3; }
    .subject-label { background: #fce8e6; color: #c5221f; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; margin-left: 8px; vertical-align: middle; letter-spacing: 0.3px; }
    .subject-label.important { background: #fef7e0; color: #b06000; margin-left: 4px; }
    .subject-star { color: #f9ab00; font-size: 20px; cursor: pointer; padding-top: 4px; }

    .sender-row { display: flex; align-items: flex-start; padding: 20px 72px 24px; gap: 16px; border-bottom: 1px solid #f1f3f4; }
    .sender-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #E2003F 0%, #FF5600 100%); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .sender-info { flex: 1; min-width: 0; }
    .sender-line-1 { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .sender-name { font-size: 14px; font-weight: 700; color: #202124; }
    .sender-email { font-size: 12px; color: #5f6368; }
    .sender-meta { font-size: 12px; color: #5f6368; }
    .sender-meta .dropdown { margin-left: 4px; cursor: pointer; }
    .sender-right { display: flex; align-items: center; gap: 8px; color: #5f6368; font-size: 12px; }
    .sender-right .icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .sender-right .icon:hover { background: #f1f3f4; }

    .email-body { padding: 0 72px 32px; background: #fff; flex: 1; }
    .email-body iframe { width: 100%; max-width: 620px; height: 1750px; border: 0; background: #FAF7F2; display: block; margin: 0 auto; }

    .action-row { padding: 16px 72px 24px; display: flex; gap: 12px; }
    .action-btn { display: flex; align-items: center; gap: 8px; padding: 10px 24px; border: 1px solid #dadce0; border-radius: 20px; background: #fff; color: #202124; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .action-btn:hover { background: #f1f3f4; }

    @media (max-width: 1100px) {
      .sidebar { width: 72px; }
      .folder span:not(.icon):not(.count) { display: none; }
      .folder .count { display: none; }
      .compose span:not(.plus) { display: none; }
    }
    @media (max-width: 800px) {
      .subject-row, .sender-row, .email-body, .action-row { padding-left: 16px; padding-right: 16px; }
      .gnav-search { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="gnav">
    <div class="gnav-burger">&#9776;</div>
    <div class="gnav-logo">
      <svg viewBox="0 0 40 29" xmlns="http://www.w3.org/2000/svg">
        <path d="M36.6 0H3.4A3.4 3.4 0 0 0 0 3.4V25.6A3.4 3.4 0 0 0 3.4 29H36.6A3.4 3.4 0 0 0 40 25.6V3.4A3.4 3.4 0 0 0 36.6 0Z" fill="#fff"/>
        <path d="M3.4 0H20L3.4 12V0Z" fill="#4285F4"/>
        <path d="M36.6 0H20l16.6 12V0Z" fill="#EA4335"/>
        <path d="M0 3.4v22.2h3.4V12L0 3.4Z" fill="#C5221F"/>
        <path d="M40 3.4v22.2h-3.4V12L40 3.4Z" fill="#FBBC04"/>
        <path d="M3.4 12L20 22 36.6 12l-3.4-4L20 16 6.8 8 3.4 12Z" fill="#34A853"/>
      </svg>
      <span class="gnav-logo-text">Gmail</span>
    </div>
    <div class="gnav-search">
      <span>&#128269;</span>
      <input placeholder="Search mail" value="" />
      <span>&#9776;</span>
    </div>
    <div class="gnav-right">
      <div class="gnav-icon" title="Support">?</div>
      <div class="gnav-icon" title="Settings">&#9881;</div>
      <div class="gnav-icon" title="Apps">&#8942;&#8942;&#8942;</div>
      <div class="gnav-avatar">T</div>
    </div>
  </div>

  <div class="shell">

    <aside class="sidebar">
      <div class="compose">
        <span class="plus">&#9998;</span>
        <span>Compose</span>
      </div>
      <ul class="folders">
        <li class="folder active"><span class="icon">&#128229;</span><span>Inbox</span><span class="count">1</span></li>
        <li class="folder"><span class="icon">&#9733;</span><span>Starred</span></li>
        <li class="folder"><span class="icon">&#128340;</span><span>Snoozed</span></li>
        <li class="folder"><span class="icon">&#10148;</span><span>Sent</span></li>
        <li class="folder"><span class="icon">&#128196;</span><span>Drafts</span></li>
        <li class="folder"><span class="icon">&#9660;</span><span>More</span></li>
      </ul>
    </aside>

    <main class="mailview">

      <div class="mtoolbar">
        <div class="mtbtn mtbtn-back" title="Back to inbox">&#8592;</div>
        <div class="mtbtn" title="Archive">&#128451;</div>
        <div class="mtbtn" title="Report spam">&#9888;</div>
        <div class="mtbtn" title="Delete">&#128465;</div>
        <div class="mtbtn-divider"></div>
        <div class="mtbtn" title="Mark unread">&#9993;</div>
        <div class="mtbtn" title="Snooze">&#128340;</div>
        <div class="mtbtn" title="Add to tasks">&#9989;</div>
        <div class="mtbtn-divider"></div>
        <div class="mtbtn" title="Move">&#128194;</div>
        <div class="mtbtn" title="Labels">&#127991;</div>
        <div class="mtbtn-page">
          <span>1 of 2,842</span>
          <div class="mtbtn">&#8249;</div>
          <div class="mtbtn">&#8250;</div>
        </div>
      </div>

      <div class="subject-row">
        <div class="subject-text">
          You won. UFC Freedom 250.
          <span class="subject-label">Inbox</span>
          <span class="subject-label important">Important</span>
        </div>
        <div class="subject-star">&#9733;</div>
      </div>

      <div class="sender-row">
        <div class="sender-avatar">N</div>
        <div class="sender-info">
          <div class="sender-line-1">
            <span class="sender-name">N1CE</span>
            <span class="sender-email">&lt;hello@n1ce.com&gt;</span>
          </div>
          <div class="sender-meta">to me <span class="dropdown">&#9660;</span></div>
        </div>
        <div class="sender-right">
          <span>9:02 AM (0 minutes ago)</span>
          <div class="icon" title="Star">&#9733;</div>
          <div class="icon" title="Reply">&#8630;</div>
          <div class="icon" title="More">&#8942;</div>
        </div>
      </div>

      <div class="email-body">
        <iframe src="/preview/winner-email" title="Winner email"></iframe>
      </div>

      <div class="action-row">
        <button class="action-btn">&#8630; Reply</button>
        <button class="action-btn">&#8631; Forward</button>
      </div>

    </main>

  </div>

</body>
</html>
